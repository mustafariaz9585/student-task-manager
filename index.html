<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Task Manager - Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#eef2ff;padding:20px;transition:0.3s}
body.dark{background:#111827;color:white}
.container{max-width:800px;margin:auto;background:white;padding:25px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.1)}
body.dark .container{background:#1f2937}
.header{display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:26px;color:#4f46e5}
body.dark .header h1{color:#a5b4fc}
.header p{color:#666;font-size:13px}
body.dark .header p{color:#ccc}
#darkBtn{background:#111827;color:white;border:none;padding:8px 14px;border-radius:20px;cursor:pointer}
body.dark #darkBtn{background:white;color:black}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
.stat{background:#f8fafc;padding:12px;border-radius:12px;text-align:center;border:1px solid #e5e7eb}
body.dark .stat{background:#374151;border-color:#4b5563}
.stat b{font-size:22px;display:block}
.stat span{font-size:12px;color:#666}
body.dark .stat span{color:#ddd}
.progress-box{margin-bottom:15px}
.progress-bg{background:#e5e7eb;height:10px;border-radius:20px;overflow:hidden}
#progressBar{background:linear-gradient(90deg,#4f46e5,#22c55e);height:100%;width:0%;transition:0.4s}
#progressText{font-size:13px;margin-top:5px;display:block;text-align:right}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.controls input,.controls select{padding:10px;border:1px solid #ddd;border-radius:10px;flex:1;min-width:120px}
body.dark .controls input,body.dark .controls select{background:#374151;color:white;border-color:#4b5563}
#addBtn{background:#4f46e5;color:white;border:none;padding:10px 20px;border-radius:10px;cursor:pointer;font-weight:bold}
#addBtn:hover{background:#4338ca}
.search-row{display:flex;gap:8px;margin-bottom:15px}
#searchInput{flex:1;padding:10px;border-radius:10px;border:1px solid #ddd}
body.dark #searchInput{background:#374151;color:white;border-color:#4b5563}
#clearBtn{background:#ef4444;color:white;border:none;padding:10px 14px;border-radius:10px;cursor:pointer}
.filters{display:flex;gap:8px;margin-bottom:15px}
.filters button{padding:8px 16px;border-radius:20px;border:1px solid #ddd;background:white;cursor:pointer}
body.dark .filters button{background:#374151;color:white}
.filters button.active{background:#4f46e5;color:white;border-color:#4f46e5}
.task{display:flex;justify-content:space-between;align-items:center;background:#f9fafb;padding:12px;border-radius:12px;margin-bottom:10px;border-left:5px solid #4f46e5}
body.dark .task{background:#374151}
.task.done{opacity:0.6;text-decoration:line-through;border-left-color:#22c55e}
.task b{font-size:15px}
.task small{color:#666;font-size:12px}
body.dark .task small{color:#ccc}
.badge{font-size:11px;padding:3px 8px;border-radius:20px;color:white}
.High{background:#ef4444}.Medium{background:#f59e0b}.Low{background:#22c55e}
.btns button{border:none;padding:7px 10px;border-radius:8px;cursor:pointer;margin-left:5px;color:white}
.doneBtn{background:#22c55e}.editBtn{background:#3b82f6}.delBtn{background:#ef4444}
.empty{text-align:center;color:#888;padding:20px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div><h1>🎓 Student Task Manager</h1><p>Apne saare tasks ek jagah manage karo</p></div>
<button id="darkBtn" onclick="toggleDark()">🌙 Dark</button>
</div>

<div class="stats">
<div class="stat"><b id="total">0</b><span>Total Tasks</span></div>
<div class="stat"><b id="doneCount">0</b><span>Completed</span></div>
<div class="stat"><b id="pendingCount">0</b><span>Pending</span></div>
<div class="stat"><b id="percent">0%</b><span>Progress</span></div>
</div>

<div class="progress-box"><div class="progress-bg"><div id="progressBar"></div></div><span id="progressText">0% Completed</span></div>

<div class="controls">
<input type="text" id="taskInput" placeholder="Task likho... e.g. Maths Assignment">
<select id="subjectInput"><option>Maths</option><option>English</option><option>Urdu</option><option>Computer Science</option><option>Physics</option><option>Chemistry</option><option>Islamiat</option></select>
<select id="priorityInput"><option>High</option><option>Medium</option><option>Low</option></select>
<input type="date" id="dateInput">
<button id="addBtn" onclick="addTask()">+ Add Task</button>
</div>

<div class="search-row">
<input type="text" id="searchInput" placeholder="🔍 Task search karo..." onkeyup="renderTasks()">
<button id="clearBtn" onclick="clearDone()">Clear Done</button>
</div>

<div class="filters">
<button onclick="setFilter('all',this)" class="active">All</button>
<button onclick="setFilter('pending',this)">Pending</button>
<button onclick="setFilter('done',this)">Completed</button>
</div>

<div id="taskList"></div>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem('tasks')||'[]');
let filter='all';
let editIndex=-1;

function save(){localStorage.setItem('tasks',JSON.stringify(tasks));}
function toggleDark(){document.body.classList.toggle('dark');document.getElementById('darkBtn').innerText=document.body.classList.contains('dark')?'☀️ Light':'🌙 Dark';}

function addTask(){
let title=document.getElementById('taskInput').value.trim();
if(!title){alert('Pehle Task likho!');return;}
let task={title:title,subject:document.getElementById('subjectInput').value,priority:document.getElementById('priorityInput').value,date:document.getElementById('dateInput').value||'No Date',done:false};
if(editIndex>=0){tasks[editIndex]=task;editIndex=-1;document.getElementById('addBtn').innerText='+ Add Task';}
else{tasks.push(task);}
document.getElementById('taskInput').value='';document.getElementById('dateInput').value='';
save();renderTasks();
}

function renderTasks(){
let list=document.getElementById('taskList');
let search=document.getElementById('searchInput').value.toLowerCase();
let filtered=tasks.filter((t,i)=>{
if(filter==='pending' && t.done) return false;
if(filter==='done' && !t.done) return false;
if(search && !t.title.toLowerCase().includes(search)) return false;
return true;
});
let total=tasks.length;
let done=tasks.filter(t=>t.done).length;
let pending=total-done;
let perc=total?Math.round(done/total*100):0;
document.getElementById('total').innerText=total;
document.getElementById('doneCount').innerText=done;
document.getElementById('pendingCount').innerText=pending;
document.getElementById('percent').innerText=perc+'%';
document.getElementById('progressBar').style.width=perc+'%';
document.getElementById('progressText').innerText=perc+'% Completed';

if(filtered.length===0){list.innerHTML='<div class="empty">Koi task nahi hai. Upar se Add karo 👆</div>';return;}
list.innerHTML='';
filtered.forEach(t=>{
let realIndex=tasks.indexOf(t);
list.innerHTML+=`<div class="task ${t.done?'done':''}">
<div><b>${t.title}</b><br><small>${t.subject} • ${t.date}</small> <span class="badge ${t.priority}">${t.priority}</span></div>
<div class="btns"><button class="doneBtn" onclick="toggleDone(${realIndex})">✓</button><button class="editBtn" onclick="editTask(${realIndex})">✏️</button><button class="delBtn" onclick="deleteTask(${realIndex})">🗑️</button></div>
</div>`;
});
}
function toggleDone(i){tasks[i].done=!tasks[i].done;save();renderTasks();}
function deleteTask(i){if(confirm('Delete kar dun?')){tasks.splice(i,1);save();renderTasks();}}
function editTask(i){
document.getElementById('taskInput').value=tasks[i].title;
document.getElementById('subjectInput').value=tasks[i].subject;
document.getElementById('priorityInput').value=tasks[i].priority;
if(tasks[i].date!=='No Date') document.getElementById('dateInput').value=tasks[i].date;
editIndex=i;document.getElementById('addBtn').innerText='Update Task';
window.scrollTo({top:0,behavior:'smooth'});
}
function setFilter(f,btn){filter=f;document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderTasks();}
function clearDone(){tasks=tasks.filter(t=>!t.done);save();renderTasks();}
renderTasks();
</script>
</body>
</html>
